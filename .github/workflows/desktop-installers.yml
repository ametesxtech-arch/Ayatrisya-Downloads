name: Build Ayatrisya desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - replit/desktop-installers
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: generated-artifacts/ayatrisya-desktop/*.AppImage
          - os: windows-latest
            target: windows
            artifact: generated-artifacts/ayatrisya-desktop/*.exe
          - os: macos-latest
            target: mac
            artifact: generated-artifacts/ayatrisya-desktop/*.dmg
    steps:
      - uses: actions/checkout@v4

      # Keep this in sync with the pnpm version used by the workspace.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Run desktop security checks
        run: pnpm --filter @workspace/ayatrisya run test:desktop:security

      - name: Build installer on native operating system
        run: pnpm --filter @workspace/ayatrisya run desktop:package:${{ matrix.target }}

      - name: Install and launch Windows build
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "generated-artifacts/ayatrisya-desktop/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }

          $installDir = Join-Path $env:RUNNER_TEMP "AyatrisyaSmoke"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Windows installer exited with code $($install.ExitCode)." }

          $app = Join-Path $installDir "ayatrisya.exe"
          if (-not (Test-Path $app)) { throw "Installed Ayatrisya executable was not found." }

          $process = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) { throw "Installed Ayatrisya exited before the startup check completed." }
          Stop-Process -Id $process.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Ayatrisya-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
